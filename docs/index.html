/* ===== MH Emerald & Gold · Control Room ===== */
:root{
  --f:'Inter','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:18px;--r2:12px;--r3:8px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
html[data-theme=dark]{
  color-scheme:dark;
  --bg:#0B100E;--bg2:#0E1311;--card:#131A17;--card2:#19221E;--line:#24302A;--line2:#2F3C36;--grid:#1F2925;
  --ink:#EEF2EF;--soft:#B7C2BC;--mut:#7E8C85;
  --em:#22C98A;--em2:#16A673;--emBg:rgba(34,201,138,.10);--gold:#E6B94A;--gold2:#B88A26;--goldBg:rgba(230,185,74,.10);
  --steel:#6FA8FF;--steel2:#4F86E0;--rose:#D05A74;--lilac:#9479E6;--bad:#F0616D;--badBg:rgba(240,97,109,.10);
  --onEm:#0B100E;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 20px 40px -24px rgba(0,0,0,.6);
  --glow:radial-gradient(1200px 500px at 85% -10%,rgba(34,201,138,.10),transparent 60%),radial-gradient(800px 400px at 0% 0%,rgba(230,185,74,.05),transparent 60%);
}
html[data-theme=light]{
  color-scheme:light;
  --bg:#F3F5F3;--bg2:#F7F9F7;--card:#FFFFFF;--card2:#F2F5F3;--line:#DFE5E1;--line2:#CDD6D0;--grid:#EAEEEB;
  --ink:#0E1311;--soft:#3A4641;--mut:#5E6B65;
  --em:#0C7F54;--em2:#16A673;--emBg:rgba(22,166,115,.10);--gold:#8A6610;--gold2:#C99A2E;--goldBg:rgba(201,154,46,.12);
  --steel:#2F65C2;--steel2:#4F86E0;--rose:#B23E5A;--lilac:#6E54C9;--bad:#C23345;--badBg:rgba(194,51,69,.08);
  --onEm:#FFFFFF;--shadow:0 1px 2px rgba(14,19,17,.04),0 12px 32px -18px rgba(14,19,17,.18);
  --glow:radial-gradient(1200px 500px at 85% -10%,rgba(22,166,115,.09),transparent 60%),radial-gradient(800px 400px at 0% 0%,rgba(201,154,46,.07),transparent 60%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);background-image:var(--glow);background-attachment:fixed;color:var(--ink);font:400 14px/1.55 var(--f);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background-color .35s var(--ease),color .35s var(--ease)}
html[lang=ar] body{font-size:14.5px;line-height:1.7}
button,input,select{font:inherit;color:inherit}
.num,.n,bdi.n{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
bdi{unicode-bidi:isolate}
a{color:var(--em)}
::selection{background:var(--emBg)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ===== Shell ===== */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--bg2) 268px,transparent 268px)}
html[dir=rtl] .shell{background:linear-gradient(270deg,var(--bg2) 268px,transparent 268px)}
aside.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 16px 18px;border-inline-end:1px solid var(--line);
  background:color-mix(in srgb,var(--bg2) 80%,transparent);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 18px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--em2);display:grid;place-items:center;position:relative;flex:none;
  box-shadow:0 8px 20px -8px rgba(22,166,115,.7)}
.mark b{font:800 15px/1 var(--f);color:#0B100E;letter-spacing:-.02em;margin-top:-3px}
.mark:after{content:"";position:absolute;left:10px;right:10px;bottom:7px;height:3px;border-radius:2px;background:#E6B94A}
.brand strong{display:block;font-size:13.5px;letter-spacing:.02em}
.brand span{display:block;font:600 10px/1.4 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
html[lang=ar] .brand span{font-family:var(--f);letter-spacing:0;font-size:11px}
.navlbl{font:600 10px var(--fm);letter-spacing:.18em;text-transform:uppercase;color:var(--mut);padding:8px 12px 6px}
html[lang=ar] .navlbl{font-family:var(--f);letter-spacing:0;font-size:11px}
nav.nav{display:flex;flex-direction:column;gap:3px}
nav.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--soft);font-weight:500;
  position:relative;transition:background .2s,color .2s}
nav.nav button:hover{background:var(--card);color:var(--ink)}
nav.nav button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
nav.nav button.on:before{content:"";position:absolute;inset-inline-start:-16px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--em)}
nav.nav button.on .ic{color:var(--em)}
nav.nav .nb{margin-inline-start:auto;font:700 11px var(--fm);padding:2px 7px;border-radius:999px;background:var(--badBg);color:var(--bad)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.simcard{border:1px dashed color-mix(in srgb,var(--gold) 45%,var(--line));background:var(--goldBg);border-radius:14px;padding:12px 14px}
.simcard b{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--gold)}
.simcard b:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--goldBg)}
.simcard span{display:block;font-size:11.5px;color:var(--soft);margin-top:4px;line-height:1.5}
.byline{font-size:11.5px;color:var(--mut);padding:0 6px}
.byline b{color:var(--soft);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 32px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(14px)}
.crumb{min-width:0;flex:1}
.crumb small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb h1{margin:0 0 1px;font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools-top{display:flex;align-items:center;gap:10px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--soft);
  cursor:pointer;font-size:12.5px;white-space:nowrap;transition:border-color .2s,color .2s}
.chipbtn:hover{border-color:var(--line2);color:var(--ink)}
.chipbtn kbd{font:600 10.5px var(--fm);padding:2px 6px;border-radius:6px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--card);gap:2px}
.seg button{all:unset;cursor:pointer;height:28px;min-width:30px;padding:0 9px;display:grid;place-items:center;border-radius:8px;font:600 12px var(--f);color:var(--mut);transition:all .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:0 0 0 1px var(--line2) inset}
.seg .ic{width:16px;height:16px}
.period{font-size:12px;color:var(--mut)}
.period b{color:var(--ink);font-weight:600}

.content{padding:28px 32px 64px;max-width:1440px;width:100%;margin:0 auto}
.page{animation:pageIn .45s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Cards & grid ===== */
.grid{display:grid;gap:18px;margin-bottom:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);min-width:0;position:relative}
.card h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.card .sub{font-size:12.5px;color:var(--mut);margin:3px 0 14px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font:600 10.5px var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
html[lang=ar] .eyebrow{font-family:var(--f);letter-spacing:0;font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--fm);padding:3px 8px;border-radius:999px;white-space:nowrap}
html[lang=ar] .pill{font-family:var(--f)}
.pill.ok{background:var(--emBg);color:var(--em)}.pill.bad{background:var(--badBg);color:var(--bad)}.pill.wn{background:var(--goldBg);color:var(--gold)}
.pill.mu{background:var(--card2);color:var(--mut);border:1px solid var(--line)}

/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:30px 32px 26px;margin-bottom:18px;border:1px solid var(--line);
  background:linear-gradient(135deg,color-mix(in srgb,var(--card) 92%,var(--em2)) 0%,var(--card) 55%,color-mix(in srgb,var(--card) 94%,var(--gold2)) 100%);box-shadow:var(--shadow)}
.hero .lanes{position:absolute;inset-inline-end:28px;top:26px;display:flex;flex-direction:column;gap:7px;opacity:.9}
.hero .lanes i{display:block;height:6px;border-radius:4px}
.hero h2{margin:10px 0 0;font-size:clamp(22px,2.4vw,32px);line-height:1.25;font-weight:700;letter-spacing:-.025em;max-width:980px}
html[lang=ar] .hero h2{line-height:1.6;letter-spacing:0}
.hero h2 bdi.n{font-family:inherit;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero h2 em{font-style:normal;color:var(--em)}.hero h2 strong{color:var(--gold);font-weight:700}
.hero p.lead{color:var(--soft);max-width:820px;margin:10px 0 22px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;min-width:0;position:relative;
  transition:transform .25s var(--ease),border-color .25s}
.kpi:hover{transform:translateY(-2px);border-color:var(--line2)}
.kpi .lbl{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;align-items:center}
.kpi .val{font:700 clamp(24px,2.3vw,34px)/1.1 var(--fm);letter-spacing:-.03em;margin:10px 0 6px;white-space:nowrap}
.kpi .val small{font:600 13px var(--f);color:var(--mut);margin-inline-start:4px;letter-spacing:0}
.kpi .cmp{font-size:12px;color:var(--soft)}
.kpi .spark{display:block;width:100%;height:34px;margin-top:10px}
.kpi.std .val{font-size:clamp(22px,2vw,30px)}

/* ===== Controls bar ===== */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{all:unset;cursor:pointer;height:32px;padding:0 13px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;
  background:var(--card);font:600 12px var(--fm);color:var(--soft);transition:all .2s}
html[lang=ar] .chips button{font-family:var(--f)}
.chips button:hover{border-color:var(--line2);color:var(--ink)}
.chips button.on{background:var(--em2);border-color:var(--em2);color:#0B100E}
.ctl{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:12.5px;color:var(--mut)}
.ctl select{border:0;background:transparent;font-weight:600;color:var(--ink);cursor:pointer;outline:none}
.ctl select option{background:var(--card);color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:180px;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--em2) 0 var(--p,60%),var(--line2) var(--p,60%) 100%);outline:none}
html[dir=rtl] input[type=range]{background:linear-gradient(270deg,var(--em2) 0 var(--p,60%),var(--line2) var(--p,60%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--em2);box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:grab}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--em2);cursor:grab}
.thrv{font:700 14px var(--fm);color:var(--ink);min-width:38px}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--soft);cursor:pointer;font-size:12.5px;font-weight:500;transition:all .2s}
.btn:hover{border-color:var(--line2);color:var(--ink)}
.btn.pri{background:var(--em2);border-color:var(--em2);color:#0B100E;font-weight:600}
.btn .ic{width:15px;height:15px}

/* ===== Charts ===== */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible;direction:ltr}
.chart svg text{unicode-bidi:plaintext}
.chart text{font-family:var(--fm);font-size:10.5px;fill:var(--mut)}
.chart .lbl-ui{font-family:var(--f)}
.chart .ann{font-family:var(--f);font-size:11px;font-weight:600}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--soft);margin:-4px 0 10px}
.lg span{display:inline-flex;align-items:center;gap:7px}
.lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.lg i.d{background-image:linear-gradient(90deg,currentColor 50%,transparent 50%)!important;background-size:6px 3px}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{opacity:0;animation:fadein .9s .25s var(--ease) forwards}
@keyframes fadein{to{opacity:1}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s var(--ease) both}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx .8s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}
.tip{position:absolute;z-index:5;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;min-width:170px;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.45);font-size:12px}
.tip.on{opacity:1;transform:none}
.tip .th{font-weight:650;margin-bottom:6px;color:var(--ink)}
.tip .tr{display:flex;align-items:center;justify-content:space-between;gap:14px;color:var(--soft);line-height:1.8}
.tip .tr i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:7px}
.tip .tr b{font-family:var(--fm);color:var(--ink);font-weight:600}
.tip .tf{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px}
.brushwrap{position:relative;margin-top:6px}
.brushwrap .hint{font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.sm-title{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;margin:4px 0 2px}

/* ===== Dumbbell list ===== */
.dl{display:flex;flex-direction:column}
.dl .row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,2fr) 92px;gap:16px;align-items:center;padding:12px 2px;border-top:1px solid var(--line)}
.dl .row:first-child{border-top:0}
.dl .k{font-size:13px;font-weight:550}.dl .k small{display:block;font-size:11.5px;color:var(--mut);font-weight:400}
.dl .track{position:relative;height:36px}
.dl .track .base{position:absolute;top:13px;height:2px;background:var(--line2);border-radius:2px}
.dl .track .seg2{position:absolute;top:12px;height:4px;border-radius:3px}
.dl .dot{position:absolute;top:7px;width:14px;height:14px;border-radius:50%;margin-inline-start:-7px;border:3px solid var(--card)}
.dl .lab{position:absolute;top:-6px;font:600 10.5px var(--fm);color:var(--mut);transform:translateX(-50%);white-space:nowrap}
html[dir=rtl] .dl .lab{transform:translateX(50%)}
.dl .delta{text-align:end}

/* ===== Tables ===== */
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools input[type=search]{height:34px;min-width:220px;flex:1;max-width:320px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);outline:none}
.tools input[type=search]:focus{border-color:var(--em2)}
.tbl{border:1px solid var(--line);border-radius:14px;overflow:auto;max-width:100%}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;z-index:1;background:var(--card2);text-align:start;font:600 10.5px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
  padding:11px 14px;border-bottom:1px solid var(--line);white-space:normal;line-height:1.35;min-width:70px;cursor:pointer;user-select:none;vertical-align:bottom}
html[lang=ar] thead th{font-family:var(--f);letter-spacing:0;font-size:11.5px}
thead th:hover{color:var(--ink)}
thead th .so{opacity:.35;margin-inline-start:4px}thead th[aria-sort=ascending] .so,thead th[aria-sort=descending] .so{opacity:1;color:var(--em)}
th.n,td.n{text-align:end}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--card2)}
td.empty{text-align:center;color:var(--mut);padding:28px}
.cb{display:inline-flex;align-items:center;gap:10px;justify-content:flex-end}
.cb .trk{width:64px;height:6px;border-radius:4px;background:var(--line);overflow:hidden;direction:ltr}
.cb .trk i{display:block;height:100%;border-radius:4px}
.best td{background:color-mix(in srgb,var(--em2) 7%,transparent)}
.best td:first-child{box-shadow:inset 3px 0 0 var(--em)}
html[dir=rtl] .best td:first-child{box-shadow:inset -3px 0 0 var(--em)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12px;color:var(--mut)}
.pager .btn{height:30px}

/* ===== Notes / prose ===== */
.prose ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.prose li{position:relative;padding-inline-start:18px;color:var(--soft);font-size:13.5px;line-height:1.6}
.prose li:before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--em2)}
.prose code{font-family:var(--fm);font-size:12px;padding:1px 6px;border-radius:6px;background:var(--card2);border:1px solid var(--line);color:var(--ink)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--steel) 30%,var(--line));background:color-mix(in srgb,var(--steel) 7%,transparent);font-size:12.5px;color:var(--soft);margin-bottom:18px}
.note .ic{color:var(--steel)}
.note.w{border-color:color-mix(in srgb,var(--gold) 35%,var(--line));background:var(--goldBg)}.note.w .ic{color:var(--gold)}
.empty-st{display:grid;place-items:center;min-height:200px;color:var(--mut);font-size:13px;text-align:center;border:1px dashed var(--line2);border-radius:14px}
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:12px;align-items:stretch}
.cm .h{color:var(--mut);font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center}
.cm .c{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line)}
.cm .c b{font:700 22px var(--fm)}.cm .c span{color:var(--mut);font-size:11px}
.cm .tp{background:var(--emBg);border-color:color-mix(in srgb,var(--em) 30%,var(--line))}.cm .tp b{color:var(--em)}
.cm .fp,.cm .fn{background:var(--goldBg)}.cm .fp b,.cm .fn b{color:var(--gold)}
.cm .tn{background:var(--card2)}
.stat2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.stat2>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:11.5px;color:var(--mut)}
.stat2 b{display:block;font:700 18px var(--fm);color:var(--ink);margin:2px 0}

/* ===== Command palette & toast ===== */
.cmdk{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(5,8,7,.55);backdrop-filter:blur(4px)}
.cmdk.on{display:flex;animation:fadein .15s forwards}
.cmdk .box{width:min(620px,92vw);background:var(--card);border:1px solid var(--line2);border-radius:18px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.cmdk input{width:100%;height:56px;padding:0 20px;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:16px;outline:none}
.cmdk ul{list-style:none;margin:0;padding:8px;max-height:52vh;overflow:auto}
.cmdk li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--soft)}
.cmdk li small{margin-inline-start:auto;font:600 10.5px var(--fm);color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.cmdk li.on{background:var(--card2);color:var(--ink)}
.cmdk li.on .ic{color:var(--em)}
.cmdk .foot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}
#toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;transition:all .25s var(--ease);pointer-events:none}
html[dir=rtl] #toast{transform:translate(50%,20px)}
#toast.on{opacity:1;transform:translate(-50%,0)}html[dir=rtl] #toast.on{transform:translate(50%,0)}

/* ===== Mobile ===== */
.bnav{display:none}
@media(max-width:1180px){.g4,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}
  .period{display:none}}
@media(max-width:900px){
  .shell,html[dir=rtl] .shell{grid-template-columns:1fr;background:none}aside.side{display:none}
  header.top{padding:12px 16px;flex-wrap:wrap;gap:10px}.crumb h1{font-size:17px}.tools-top{width:100%;justify-content:space-between}
  .chipbtn .lbl,.chipbtn kbd{display:none}
  .chipbtn{padding:0 10px}.seg button{min-width:26px;padding:0 7px}.tools-top{gap:6px}
  .card-h{flex-wrap:wrap}
  .content{padding:18px 14px 110px}
  .hero{padding:22px 18px 18px;border-radius:20px}.hero .lanes{display:none}
  .kpis{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -18px;padding:0 18px 4px}
  .kpis .kpi{flex:0 0 76%;scroll-snap-align:start}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g3,.g2{grid-template-columns:1fr}
  .card{padding:16px}.dl .row{grid-template-columns:1fr 70px;gap:8px}.dl .track{grid-column:1/-1;grid-row:2}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--bg2) 90%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .bnav button{all:unset;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut);padding:4px 8px;border-radius:10px;min-width:56px;text-align:center}
  .bnav button.on{color:var(--em)}
  input[type=range]{width:130px}
}
@media(max-width:520px){.g4{grid-template-columns:1fr 1fr}.kpi .val{font-size:24px}.tools input[type=search]{min-width:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}.draw{stroke-dashoffset:0}}

/* ===== Print ===== */
@media print{
  html[data-theme]{--bg:#fff;--card:#fff;--card2:#F4F6F4;--line:#DDE3DF;--ink:#0E1311;--soft:#333;--mut:#555}
  body{background:#fff}aside.side,header.top .tools-top,.bnav,.tools,.pager,.cmdk{display:none!important}
  header.top{position:static;border:0}.content{padding:0}.card,.hero{box-shadow:none;break-inside:avoid}
}

/* ===== Scheduling control room components ===== */
.okc{color:var(--em)}b.bad,.bad{color:var(--bad)}
.gscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;direction:ltr}
.gscroll svg{display:block;width:100%;height:auto}
.op{transition:transform .75s var(--ease),opacity .2s}
.op rect{transition:opacity .2s}
svg.hl .op{opacity:.2}svg.hl .op.on{opacity:1}
.kstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:0 0 12px}
.kstrip>div{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--card2);min-width:0}
.kstrip span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kstrip b{display:flex;align-items:center;gap:6px;font:700 17px/1.3 var(--fm);margin-top:2px;white-space:nowrap}
.kstrip b .ic{width:14px;height:14px;flex:none}
.kstrip>div:last-child b{font:600 12px/1.6 var(--f);white-space:normal}
.kstrip .pill{margin-top:4px;font-size:10px;padding:1px 6px}
.src{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;margin:0 0 8px;border:1px solid var(--line)}
.src .ic{width:14px;height:14px}
.src.pre{background:var(--emBg);color:var(--em);border-color:color-mix(in srgb,var(--em) 30%,var(--line))}
.src.live{background:var(--goldBg);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 30%,var(--line))}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px}
.step{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card2);transition:border-color .2s,background .2s}
.step:hover{border-color:var(--line2)}
.step.on{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));background:var(--goldBg)}
.step .sn{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font:700 12px var(--fm)}
.step.on .sn{background:var(--gold2);color:#0B100E;border-color:var(--gold2)}
.step b{display:block;font-size:13px}.step small{display:block;font-size:11.5px;color:var(--mut);line-height:1.5;margin-top:2px}
.step:focus-visible,.qc button:focus-visible,.btn:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.pipe{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:p}
.pipe li{position:relative;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card2)}
.pipe li:not(:last-child):after{content:"";position:absolute;top:24px;inset-inline-end:-10px;width:10px;height:2px;background:var(--em2)}
.pipe .pn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--em2);color:#0B100E;font:700 12px var(--fm)}
.pipe b{display:block;margin:8px 0 3px;font-size:13px}.pipe small{display:block;font-size:11.5px;line-height:1.5;color:var(--mut)}
.cmdex{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--mut)}
.cmdex code,.act code{font:500 11.5px var(--fm);padding:4px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--soft);direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ins li{display:flex;gap:10px;font-size:13px;color:var(--soft);line-height:1.6}
.ins i{flex:none;width:4px;border-radius:2px}
.ins b{color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:430px;min-height:220px;overflow:auto;padding:4px 2px 8px;scroll-behavior:smooth}
.msg{font-size:13px;line-height:1.6;max-width:100%}
.msg.u{align-self:flex-end;background:var(--em2);color:#0B100E;font-weight:550;padding:8px 12px;border-radius:14px 14px 4px 14px;max-width:85%}
html[dir=rtl] .msg.u{border-radius:14px 14px 14px 4px}
.msg.a{display:flex;gap:9px;align-items:flex-start}
.msg.a>div{background:var(--card2);border:1px solid var(--line);padding:10px 12px;border-radius:4px 14px 14px 14px;min-width:0;flex:1;color:var(--soft)}
html[dir=rtl] .msg.a>div{border-radius:14px 4px 14px 14px}
.msg .av{flex:none;width:26px;height:26px;border-radius:8px;background:var(--em2);display:grid;place-items:center;position:relative}
.msg .av b{font:800 9px var(--f);color:#0B100E;margin-top:-2px}.msg .av:after{content:"";position:absolute;left:6px;right:6px;bottom:4px;height:2px;border-radius:1px;background:#E6B94A}
.msg code{font:500 11.5px var(--fm);padding:1px 5px;border-radius:5px;background:var(--card);border:1px solid var(--line);color:var(--ink);unicode-bidi:isolate}
.act{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}.act code{display:block;font-size:10.5px}
.mn{font-size:12px;color:var(--gold);margin:4px 0}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.res>div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.res span{display:block;font-size:10.5px;color:var(--mut)}.res b{font:600 13px var(--fm);color:var(--ink)}
.res b.okc,.res b.bad{font:600 11.5px var(--f)}.res b.okc{color:var(--em)}.res b.bad{color:var(--bad)}
.srcl{margin-top:8px;font-size:11px;color:var(--gold);font-weight:600}.srcl.pre{color:var(--em)}
.mini{display:flex;flex-direction:column;gap:5px;margin-top:8px}.mini>div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.mini span:first-child{font:600 11.5px var(--fm);color:var(--ink)}
.qc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.qc button{all:unset;cursor:pointer;font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--soft);background:var(--card2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qc button:hover{border-color:var(--em2);color:var(--ink)}
.chatin{display:flex;gap:8px}
.chatin input{flex:1;min-width:0;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card2);outline:none;font-size:13.5px}
.chatin input:focus{border-color:var(--em2)}
.chatin .btn{height:40px;width:44px;justify-content:center;padding:0}
html[dir=rtl] .chatin .btn .ic{transform:scaleX(-1)}
.evlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.evlog li{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card2)}
.evlog .pn{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--gold2);color:#0B100E;font:700 11px var(--fm)}
.evlog small{margin-inline-start:auto;color:var(--mut);font-size:11px;white-space:nowrap}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--soft);cursor:pointer;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tog input{accent-color:#16A673;width:15px;height:15px}
.rt{font-size:12px;color:var(--soft);direction:ltr;unicode-bidi:isolate}
.dotl{display:inline-flex;align-items:center;gap:7px}.dotl:before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.refs ol{margin:8px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--soft);line-height:1.6}
.refs a{overflow-wrap:anywhere}
.prose h3{display:flex;align-items:center;gap:8px}.prose h3 .ic{color:var(--em)}
.g4 .kpi.std .val{font-size:clamp(20px,1.8vw,28px)}

#app>div>.card{margin-bottom:18px}.grid>div>.card+.card{margin-top:18px}
.kstrip{grid-template-columns:repeat(auto-fit,minmax(122px,1fr))}
td .rt{white-space:normal;display:inline-block;min-width:180px;max-width:340px;line-height:1.5}
.kstrip span.pill{display:inline-flex}
.refs li:before{display:none}.refs li{padding-inline-start:4px}
.grid>div{min-width:0}
@media(max-width:900px){.bnav button{flex:1;min-width:0;padding:4px 2px}.bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9.5px}}

/* plan computation: base plan, then events applied in order */

function gridKey(b,base,ev){if(base!="OPT"||!BK[b].sc)return null;let k=null;
  if(ev.kind=="breakdown")k=`b:${ev.machine}:${ev.time}:${ev.duration}`;else if(ev.kind=="rush"&&ev.time==60&&ev.due==null)k=`r:${ev.job}`;

  let I=baseInst(b),S=basePlan(b,base),prev=null,src=null,fz={},now=null,info=null;
  events.forEach((ev,i)=>{const J=applyEvent(I,ev),broken=ev.kind=="breakdown"?ev.machine:null;fz=frozenOps(J,S,ev.time,broken);

    info={before:kpis(I,S),dev:deviation(S,N,fz)};prev=S;S=N;I=J;now=ev.time});

  const xs=o.pts.map(p=>p.x),ys=o.pts.map(p=>p.y),TX=ticks(Math.min(...xs)*.92,Math.max(...xs)*1.04,4),TY=ticks(Math.min(...ys)*.9,Math.max(...ys)*1.06,4);
  const X=v=>m.l+(v-TX.lo)/(TX.hi-TX.lo)*iw,Y=v=>m.t+ih-(v-TY.lo)/(TY.hi-TY.lo)*ih,anim=st.anim&&!reduced();let g="";
  TY.t.forEach((v,k)=>{const y=Y(v);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--grid)" ${k?'stroke-dasharray="2 6"':""}/><text x="${m.l-10}" y="${y+3.5}" text-anchor="end">${num(v)}</text>`});
  TX.t.forEach(v=>{g+=`<text x="${X(v)}" y="${H-22}" text-anchor="middle">${num(v)}</text>`});
  g+=`<text class="lbl-ui" x="${m.l+iw/2}" y="${H-4}" text-anchor="middle" style="font-size:11px">${esc(o.xl)}</text><text class="lbl-ui" x="${m.l}" y="${m.t-6}" style="font-size:11px">${esc(o.yl)}</text>`;
  const line=o.pts.filter(p=>!p.solo);g+=`<path class="${anim?"draw":""}" pathLength="1" d="${line.map((p,i)=>(i?"L":"M")+X(p.x)+" "+Y(p.y)).join("")}" fill="none" stroke="var(--em2)" stroke-width="2"/>`;
  o.pts.forEach((p,i)=>{const x=X(p.x),y=Y(p.y),c=p.solo?C.rose:p.hl?C.gold:C.em;g+=`<g class="${anim?"fadein":""}"><circle cx="${x}" cy="${y}" r="${p.hl?7:5}" fill="${c}" stroke="var(--card)" stroke-width="2"/><text x="${x+(p.dx||9)}" y="${y+(p.dy||-9)}" text-anchor="${p.anchor||"start"}" style="fill:var(--soft);font-weight:600;font-size:10.5px">${p.l}</text></g>`});
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" dir="ltr" role="img">${g}</svg>`}
/* per-category dot range (min..max connector) */
function dotRange(host,o){const W=host.clientWidth||700,H=o.h||260,m={l:50,r:10,t:12,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b,n=o.cats.length;
  const T=ticks(0,Math.max(...o.series.flatMap(s=>s.vals))*1.06,4),X=i=>m.l+(i+.5)*iw/n,Y=v=>m.t+ih-v/T.hi*ih,anim=st.anim&&!reduced();let g="";
  T.t.forEach((v,k)=>{const y=Y(v);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--grid)" ${k?'stroke-dasharray="2 6"':""}/><text x="${m.l-10}" y="${y+3.5}" text-anchor="end">${num(v)}</text>`});
  const step=xTickStep(n,iw,22);o.cats.forEach((c,i)=>{const vs=o.series.map(s=>s.vals[i]);g+=`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(Math.min(...vs))}" y2="${Y(Math.max(...vs))}" stroke="var(--line2)" stroke-width="3" stroke-linecap="round"/>`;
    if(i%step==0)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${c}</text>`;
    o.series.forEach((s,j)=>{g+=`<circle class="${anim?"fadein":""}" style="animation-delay:${(i*.02).toFixed(2)}s" cx="${X(i)}" cy="${Y(s.vals[i])}" r="4.5" fill="${s.color}" stroke="var(--card)" stroke-width="1.5"/>`})});
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" dir="ltr" role="img">${g}<line class="cx" y1="${m.t}" y2="${m.t+ih}" stroke="var(--line2)" opacity="0"/><rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const svg=host.querySelector("svg"),cx=svg.querySelector(".cx");
  svg.addEventListener("pointermove",e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*(W/r.width),i=Math.max(0,Math.min(n-1,Math.floor((px-m.l)/iw*n)));cx.setAttribute("x1",X(i));cx.setAttribute("x2",X(i));cx.setAttribute("opacity",1);
    tipAt(host,`<div class="th">${o.tl(o.cats[i])}</div>`+o.series.map(s=>trow(s.color,s.name,num(s.vals[i]))).join(""),X(i)*(r.width/W),e.clientY-r.top)});
  svg.addEventListener("pointerleave",()=>{cx.setAttribute("opacity",0);tipOff(host)})}

/* ===== Copilot parser (EN / ID / AR, rule-based, offline) ===== */
const AR_D="٠١٢٣٤٥٦٧٨٩",FA_D="۰۱۲۳۴۵۶۷۸۹";
function normCmd(s){return s.toLowerCase().replace(/[٠-٩]/g,c=>AR_D.indexOf(c)).replace(/[۰-۹]/g,c=>FA_D.indexOf(c)).replace(/،/g,",").replace(/[–—]/g,"-").replace(/\s+/g," ").trim()}
const TM="(\\d+(?:[.,]\\d+)?(?:\\s*(?:h|jam|hours?|ساعة|ساعات)(?:\\s*\\d+)?)?)(?:\\s*(?:min|mins|minutes|menit|mnt|m|دقيقة|دقائق|د)\\b)?";
function ptime(s){if(s==null)return null;s=s.trim().replace(",",".");const h=s.match(/^(\d+(?:\.\d+)?)\s*(?:h|jam|hours?|ساعة|ساعات)\s*(\d+)?$/);if(h)return Math.round(+h[1]*60)+(+(h[2]||0));const m=s.match(/^(\d+)/);return m?+m[1]:null}
function findMachines(s){const out=[];MALIAS.forEach((al,m)=>al.forEach(a=>{const re=/^[a-z]+$/.test(a)?new RegExp("\\b"+a+"\\b","g"):new RegExp(a,"g");let x;while((x=re.exec(s)))out.push({m,i:x.index,len:a.length})}));
  let x;const re=/\bm([1-9])\b/g;while((x=re.exec(s)))out.push({m:+x[1]-1,i:x.index,len:x[0].length,bad:+x[1]>MN.length});return out.sort((a,b)=>a.i-b.i)}
const kw=(s,list)=>{for(const k of list){const re=new RegExp("(?:^|[^a-z\\u0600-\\u06ff])(?:"+k+")\\s*"+TM,"i"),x=s.match(re);if(x)return ptime(x[1])}return null};
const K_START=["at","from","pada","jam","mulai","dari","sejak","عند","من","منذ","الساعة"],K_DUR=["for","selama","durasi","لمدة","مدة","مدته"],K_END=["to","until","till","sampai","hingga","إلى","الى","حتى","لغاية"],K_DUE=["due","due at","deadline","jatuh tempo","tenggat","batas","موعد","موعده","تسليم","بحلول"],K_W=["weight","bobot","وزن","الوزن"];
function parseCmd(raw,I,now){const s=normCmd(raw),acts=[],notes=[],errs=[];const has=re=>re.test(s);
  const jobs=[...s.matchAll(/\bj(?:ob)?\s*(\d+)\b/g)].map(x=>+x[1]);
  if(has(/^(help|bantuan|tolong|مساعدة|ساعدني|\?)$/)||has(/\b(help|bantuan)\b|مساعدة/))return{meta:"help"};
  if(has(/\bundo\b|\bbatal|تراجع/))return{meta:"undo"};
  if(has(/\breset\b|start over|mulai ulang|إعادة ضبط|ابدأ من جديد|من البداية/))return{meta:"reset"};
  if(has(/compare|bandingkan|banding|قارن|مقارنة/))return{meta:"cmp"};
  if(has(/new (?:job|order)|job baru|pesanan baru|order baru|أمر جديد|طلب جديد|امر جديد/)){
    const cut=s.search(/\bdue\b|jatuh tempo|tenggat|deadline|موعد|تسليم|\bweight\b|bobot|وزن/),body=cut>0?s.slice(0,cut):s,route=[];
    findMachines(body).forEach(f=>{const x=body.slice(f.i+f.len).match(/^\s*[:=]?\s*(\d+)/);if(x&&!f.bad)route.push([f.m,+x[1]])});
    if(!route.length){errs.push(["notUnd"]);return{errs}}
    const due=kw(s,K_DUE),w=kw(s,K_W),at=kw(s,["at","pada","عند"]),time=at!=null&&at!==due?at:now,work=sum(route.map(r=>r[1]));

  ...["q_bd","q_bd2","q_rush","q_due","q_cmp"].map(q=>({ic:"chat",l:t(q),kw:"copilot command perintah أمر",g:t("cCmd"),run:()=>{st.page="pl";render(true);setTimeout(()=>runCmd(t(q)),30)}})),
  ...D.books.map(b=>({ic:"book",l:t("book")+" "+num(b.seed)+(b.sc?" ★":""),kw:"book buku دفتر seed "+b.seed,g:t("cBook"),run:()=>{st.book=b.seed;st.events=[];st.msgs=[];go("pl")}})),
  ...LANGS.map((l,i)=>({ic:"globe",l:S.langName[i],kw:["english inggris إنجليزية","indonesian indonesia إندونيسية","arabic arab عربي"][i],g:t("cLang"),run:()=>setLang(l)})),
  ...[["light","sun"],["dark","moon"],["system","sys"]].map(([k,i])=>({ic:i,l:t(k),g:t("cTheme"),run:()=>setTheme(k)})),
  {ic:"link",l:t("copyLink"),g:t("cAct"),run:()=>{writeHash();(navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>toast(t("linkOk"))).catch(()=>toast(location.href))}},
  {ic:"print",l:t("print"),g:t("cAct"),run:()=>setTimeout(()=>print(),150)}]}
function cmdRender(){const q=$("#cmdq").value.trim().toLowerCase();cmdList=cmdItems().filter(x=>!q||(x.l+" "+(x.kw||"")+" "+x.g).toLowerCase().includes(q)).slice(0,40);cmdSel=Math.min(cmdSel,Math.max(0,cmdList.length-1));
  $("#cmdl").innerHTML=cmdList.map((x,i)=>`<li class="${i==cmdSel?"on":""}" data-ci="${i}">${ic(x.ic)}<span>${x.l}</span><small>${x.g}</small></li>`).join("")||`<li>${t("noRes")}</li>`}
function cmdOpen(){$("#cmdk").classList.add("on");$("#cmdq").placeholder=t("cmd");$("#cmdf").innerHTML=`<span><kbd>↑↓</kbd> ${t("cmdNav")}</span><span><kbd>↵</kbd> ${t("cmdOpen")}</span><span><kbd>Esc</kbd> ${t("cmdClose")}</span>`;$("#cmdq").value="";cmdSel=0;cmdRender();setTimeout(()=>$("#cmdq").focus(),10)}
function cmdClose(){$("#cmdk").classList.remove("on")}
function go(p){if(p!="ov"&&st.playing)togglePlay();st.page=p;render(true);scrollTo({top:0})}
function setLang(l){st.lang=l;store("lang",l);render(false)}
function setTheme(k){st.theme=k;store("theme",k);applyTheme();render(false)}

/* ===== Events ===== */
document.addEventListener("click",e=>{
  const n=e.target.closest("[data-p]");if(n){go(n.dataset.p);return}
  const L=e.target.closest("[data-lang]");if(L){setLang(L.dataset.lang);return}
  const Th=e.target.closest("[data-theme]");if(Th&&Th.tagName=="BUTTON"){setTheme(Th.dataset.theme);return}
  if(e.target.closest("[data-cmdk]")){cmdOpen();return}
  if(e.target.id=="cmdk"){cmdClose();return}
  const ci=e.target.closest("[data-ci]");if(ci){const x=cmdList[+ci.dataset.ci];cmdClose();x&&x.run();return}
  const sy=e.target.closest("[data-story]");if(sy){if(st.playing)togglePlay();setStory(+sy.dataset.story);return}
  if(e.target.closest("[data-play]")){togglePlay();return}
  if(e.target.closest("[data-openstory]")){st.book=STORY.b;st.base="OPT";st.method=st.story==1?"right_shift":"stable";st.events=st.story?[{kind:"breakdown",machine:STORY.m,time:STORY.t0,duration:STORY.d}]:[];st.msgs=[];go("pl");return}
  const mt=e.target.closest("[data-method]");if(mt){st.method=mt.dataset.method;$$("[data-method]").forEach(b=>b.classList.toggle("on",b==mt));plan();st.anim=true;redraw.length=0;afterPlanner(true);st.anim=false;writeHash();return}
  if(e.target.closest("[data-reset-plan]")){st.events=[];st.msgs=[];plan();st.anim=true;redraw.length=0;afterPlanner(true);st.anim=false;shell();writeHash();return}
  const qq=e.target.closest("[data-q]");if(qq&&qq.tagName=="BUTTON"&&qq.closest(".qc")){runCmd(t(qq.dataset.q));shell();return}
  const th=e.target.closest("[data-s]");if(th){const [id,i]=th.dataset.s.split(":"),T=TB[id];T.dir=T.sort==+i?-T.dir:1;T.sort=+i;T.page=0;tblRefresh(id);return}
  const pg=e.target.closest("[data-pg]");if(pg){const [id,d]=pg.dataset.pg.split(":");TB[id].page+=+d;tblRefresh(id);return}
  const c=e.target.closest("[data-csv]");if(c)exportCSV(c.dataset.csv);
});
document.addEventListener("submit",e=>{if(e.target.id=="chatF"){e.preventDefault();const i=$("#chatI");runCmd(i.value);i.value="";shell();i.focus()}});
document.addEventListener("change",e=>{
  if(e.target.id=="selBook"){st.book=+e.target.value;st.events=[];st.msgs=[];rerender();return}
  if(e.target.id=="selBase"){st.base=e.target.value;rerender();return}
  if(e.target.id=="chg"){st.chg=e.target.checked;redraw.length=0;afterPlanner(false);return}
  if(e.target.id=="selRB"){st.rbook=+e.target.value;st.anim=true;liveRules();st.anim=false;writeHash()}});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="k"){e.preventDefault();$("#cmdk").classList.contains("on")?cmdClose():cmdOpen();return}
  if($("#cmdk").classList.contains("on")){if(e.key=="Escape")cmdClose();else if(e.key=="ArrowDown"){cmdSel=Math.min(cmdList.length-1,cmdSel+1);cmdRender();e.preventDefault()}else if(e.key=="ArrowUp"){cmdSel=Math.max(0,cmdSel-1);cmdRender();e.preventDefault()}else if(e.key=="Enter"){const x=cmdList[cmdSel];cmdClose();x&&x.run()}return}});
document.addEventListener("input",e=>{if(e.target.id=="cmdq"){cmdSel=0;cmdRender();return}
  if(e.target.dataset.q&&TB[e.target.dataset.q]){const id=e.target.dataset.q;TB[id].q=e.target.value;TB[id].page=0;tblRefresh(id)}});
let rz,lastW=innerWidth;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(Math.abs(innerWidth-lastW)<2)return;lastW=innerWidth;st.anim=false;redraw.forEach(f=>f())},140)});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(st.theme=="system")applyTheme()});
addEventListener("hashchange",()=>{const before=location.hash;readHash();applyTheme();if("#"+new URLSearchParams(location.hash.slice(1)).toString()!==before||true)render(true)});
readHash();applyTheme();render(true);

</script>
</body>
</html>
